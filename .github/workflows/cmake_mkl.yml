---
name: CMake MKL

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # BLAS64 requires DLONG for MKL: the ILP64 interface layer must match
        # the pardiso_64 entry point (which needs 64-bit integer indices).
        include:
          - blas64: OFF
            dlong: OFF
            shared: ON
          - blas64: OFF
            dlong: ON
            shared: ON
          - blas64: ON
            dlong: ON
            shared: ON
          # static row: the relocated package must drive a real Pardiso
          # solve through find_package (dlong OFF: qp.c uses int indices)
          - blas64: OFF
            dlong: OFF
            shared: OFF

    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Intel Apt repository
      run: |
        wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS-2023.PUB
        sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS-2023.PUB
        rm GPG-PUB-KEY-INTEL-SW-PRODUCTS-2023.PUB
        echo "deb https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update

    - name: Install Intel oneAPI MKL
      run: sudo apt-get install -y intel-oneapi-mkl-devel

    - name: Setup Intel oneAPI environment
      run: |
        ONEAPI=/opt/intel/oneapi
        echo "MKLROOT=$ONEAPI/mkl/latest" >> $GITHUB_ENV
        # The compiler directory contains libiomp5 (Intel OpenMP runtime).
        # Both the linker (-L) and runtime loader (LD_LIBRARY_PATH) need it.
        echo "OMPROOT=$ONEAPI/compiler/latest" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$ONEAPI/mkl/latest/lib/intel64:$ONEAPI/compiler/latest/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: checkout project code
      uses: actions/checkout@v7

    - name: Build SCS MKL and test
      run: |
        mkdir out
        export INSTALL_DIR=$PWD/out
        export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$INSTALL_DIR/lib
        mkdir build
        cd build
        cmake -DBUILD_TESTING=ON -DBLAS64=${{ matrix.blas64 }} -DDLONG=${{ matrix.dlong }} -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_INSTALL_PREFIX:PATH=$INSTALL_DIR ..
        make
        make install
        ctest --output-on-failure
        # qp.c uses int indices (DLONG=OFF) and links the shared library by hand
        if [[ "${{ matrix.dlong }}" == "OFF" && "${{ matrix.shared }}" == "ON" ]]; then
          cd ../docs/src/examples/
          gcc -I$INSTALL_DIR/include/scs -L$INSTALL_DIR/lib/ qp.c -o qp.out -lscsmkl
          ./qp.out
        fi

    - name: Static MKL export is relocatable and drives a real Pardiso solve
      if: matrix.shared == 'OFF'
      run: |
        set -euo pipefail
        # relocate the installed prefix: any surviving build-path
        # reference breaks from here on
        mv out relocated-prefix
        # the packaging consumer, linked against scs::scsmkl through
        # find_package on the relocated prefix, must solve via MKL Pardiso
        cmake -S test/packaging -B qp-build -DSCS_COMPONENT=scsmkl \
          -DCMAKE_PREFIX_PATH="$PWD/relocated-prefix"
        cmake --build qp-build -j
        ./qp-build/consume | grep -q mkl-pardiso

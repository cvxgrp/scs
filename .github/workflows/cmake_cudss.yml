---
name: Build and Test cudss

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  linux:
    # Test the oldest CUDA scs supports and the newest Jimver can install.
    # NVIDIA's apt repo for Ubuntu 26.04 starts at CUDA 13.3, so older CUDA
    # needs ubuntu-24.04. Jimver installs its own default if no cuda is given.
    strategy:
      fail-fast: false
      matrix:
        # apt's cudss (1.0) defaults to its CUDA 13 build, which cannot link
        # against CUDA 12, so cuDSS is built and tested on the CUDA 13 entry only.
        include:
          - cuda: '12.6.0'
            os: ubuntu-24.04
            cudss: false
          - cuda: '13.3.1'
            os: ubuntu-latest
            cudss: true
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          # Name the packages: without sub-packages Jimver installs the full
          # cuda-X-Y metapackage, whose NVIDIA driver (DKMS) fails to build on
          # the runner's kernel for CUDA 12.x. nvcc pulls cudart-dev and cccl;
          # libcudss links against nvrtc.
          sub-packages: '["nvcc", "nvrtc"]'
          non-cuda-sub-packages: '["libcublas-dev", "libcusparse-dev", "libnvjitlink-dev"]'

      - name: Install deps
        run: sudo apt-get install libopenblas-dev liblapack-dev
      - name: Install cudss
        if: matrix.cudss
        run: sudo apt-get -y install cudss

      - name: Build SCS cudss
        if: matrix.cudss
        run: |
          mkdir out
          export INSTALL_DIR=$PWD/out
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$INSTALL_DIR/lib
          mkdir build
          cd build
          cmake -DBUILD_TESTING=ON -DDLONG=0 -DUSE_CUDSS=1 -DCMAKE_INSTALL_PREFIX:PATH=$INSTALL_DIR ..
          make
          make install
        #   ctest --output-on-failure

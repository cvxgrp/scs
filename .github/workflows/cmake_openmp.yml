---
name: CMake OpenMP

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get install libopenblas-dev liblapack-dev
          mkdir out
          export INSTALL_DIR=$PWD/out
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$INSTALL_DIR/lib
          mkdir build
          cd build
          cmake -DUSE_OPENMP=ON -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX:PATH=$INSTALL_DIR ..
          make
          make install
          ctest --output-on-failure
          cd ../docs/src/examples/
          gcc -I$INSTALL_DIR/include/scs -L$INSTALL_DIR/lib/ qp.c -o qp.out -lscsdir
          ./qp.out
      - name: The same with the parallel PSD projection
        # The grep fails the step if the PSD thread tests did not run the
        # parallel projection.
        run: |
          mkdir build_psd
          cd build_psd
          cmake -DUSE_OPENMP=ON -DUSE_PARALLEL_PSD=ON -DBUILD_TESTING=ON ..
          make
          ctest -V > ctest.log 2>&1 || { cat ctest.log; exit 1; }
          grep "psd blocks projected by" ctest.log
      - name: OpenMP that CMake does not find
        # CMAKE_DISABLE_FIND_PACKAGE_OpenMP makes CMake behave as on a machine
        # without OpenMP. USE_OPENMP alone must then configure a build without
        # it and say so, and with USE_PARALLEL_PSD the configuration must stop.
        run: |
          mkdir build_no_openmp
          cd build_no_openmp
          cmake -DUSE_OPENMP=ON -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON .. > configure.log 2>&1 || { cat configure.log; exit 1; }
          grep "OpenMP parallelization is OFF" configure.log || { cat configure.log; exit 1; }
          if cmake -DUSE_OPENMP=ON -DUSE_PARALLEL_PSD=ON -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON .. > configure_psd.log 2>&1; then
            cat configure_psd.log
            echo "::error::CMake configured USE_PARALLEL_PSD without OpenMP"
            exit 1
          fi
          grep "USE_PARALLEL_PSD requires OpenMP" configure_psd.log || { cat configure_psd.log; exit 1; }


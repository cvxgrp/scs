name: Build and Test with Spectral Cones

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        long: [0, 1]
        spectral: [0, 1]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev
      - run: make DLONG=${{ matrix.long }} USE_LAPACK=1 USE_SPECTRAL_CONES=${{ matrix.spectral }}
      - run: make test DLONG=${{ matrix.long }} USE_LAPACK=1 USE_SPECTRAL_CONES=${{ matrix.spectral }}
      - run: out/run_tests_direct    # test direct solver
      - run: out/run_tests_indirect  # test indirect solver
      - run: out/run_tests_dense     # test dense solver

  mac:
    strategy:
      fail-fast: false
      matrix:
        long: [0, 1]
        spectral: [0, 1]

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/brew-blas
      # Each `run:` step is a separate shell, so `export` would not persist.
      # -fno-sanitize-recover=all makes UBSan abort on the first report instead of
      # printing and continuing (which would leave the job green).
      - run: echo 'CC=clang -fsanitize=address -fsanitize=undefined -fsanitize=float-divide-by-zero -fsanitize=float-cast-overflow -fno-sanitize-recover=all' >> $GITHUB_ENV
      - run: make DLONG=${{ matrix.long }} USE_LAPACK=1 USE_SPECTRAL_CONES=${{ matrix.spectral }}
      - run: make test DLONG=${{ matrix.long }} USE_LAPACK=1 USE_SPECTRAL_CONES=${{ matrix.spectral }}
      - run: out/run_tests_direct    # test direct solver
      - run: out/run_tests_indirect  # test indirect solver
      - run: out/run_tests_dense     # test dense solver

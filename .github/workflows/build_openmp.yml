---
name: Build and Test OpenMP

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  linux:
    strategy:
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
    - name: checkout project code
      uses: actions/checkout@v7

    - name: install deps
      run: sudo apt-get install libopenblas-dev liblapack-dev

    - name: Build SCS with OpenMP and test
      # Without USE_PARALLEL_PSD the PSD blocks are projected one after
      # another, and no block is held to one OpenMP thread: the PSD thread
      # tests check that and say so.
      run: |
        set -o pipefail
        make USE_OPENMP=1 test
        out/run_tests_direct | tee out/direct.log
        out/run_tests_indirect
        out/run_tests_dense
        grep "psd blocks projected serially" out/direct.log
        grep "psd serial hold: none" out/direct.log

    - name: Build SCS with the parallel PSD projection and test
      # The greps fail the step if the PSD thread tests did not run the
      # parallel projection (a flag that did not reach the compiler, say), or
      # the serial projection without holding its small blocks to one thread.
      run: |
        set -o pipefail
        make purge
        make USE_OPENMP=1 USE_PARALLEL_PSD=1 test
        out/run_tests_direct | tee out/direct.log
        out/run_tests_indirect
        out/run_tests_dense
        grep "psd blocks projected by" out/direct.log
        grep -E "psd serial hold: [1-9][0-9]* blocks" out/direct.log

    - name: Parallel PSD projection through the syev / heev fallback, with spectral cones
      # The test-only flag SCS_FORCE_PSD_FALLBACK (see build.yml) with the
      # parallel projection: the fallback runs in several threads at once,
      # and the spectral cones share a workspace with the PSD blocks of the
      # first thread. The greps fail the step if the parallel projection or
      # the fallback did not run.
      run: |
        set -o pipefail
        make purge
        make USE_OPENMP=1 USE_PARALLEL_PSD=1 USE_SPECTRAL_CONES=1 OPT="-O3 -march=native -fno-math-errno -DSCS_FORCE_PSD_FALLBACK" test
        out/run_tests_direct | tee out/direct.log
        out/run_tests_indirect
        out/run_tests_dense
        grep "psd blocks projected by" out/direct.log
        grep -E "psd serial hold: [1-9][0-9]* blocks" out/direct.log
        grep -E "^SCS_FORCE_PSD_FALLBACK: [1-9][0-9]* PSD blocks" out/direct.log

    - name: Parallel PSD projection with an OpenMP build of OpenBLAS
      # An OpenMP OpenBLAS follows the OpenMP thread count, so the serial
      # projection's hold reaches it, and test_psd_serial_hold compares the
      # held blocks bit for bit with the projection on one thread: without
      # the hold they run on 4 threads and do not match (checked with
      # Ubuntu 26.04's OpenBLAS 0.3.32). The greps fail the step if the tests
      # ran another BLAS or did not compare bit for bit. If the package
      # cannot be installed, the step warns and passes.
      run: |
        set -o pipefail
        if ! sudo apt-get install -y libopenblas0-openmp; then
          echo "::warning::libopenblas0-openmp did not install: the OpenMP OpenBLAS check did not run"
          exit 0
        fi
        OB=/usr/lib/x86_64-linux-gnu/openblas-openmp
        make purge
        make USE_OPENMP=1 USE_PARALLEL_PSD=1 BLASLDFLAGS="-L$OB -l:libopenblas.so.0 -Wl,-rpath,$OB" test
        ldd out/run_tests_direct | grep "$OB/libopenblas.so.0"
        out/run_tests_direct | tee out/direct.log
        out/run_tests_indirect
        out/run_tests_dense
        grep "psd blocks projected by" out/direct.log
        grep -E "psd serial hold: [1-9][0-9]* blocks .*compared bit for bit" out/direct.log
